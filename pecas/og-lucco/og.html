<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
/* OG da página /artistas/lucco (Royals, 29/10/2026): identidade do artista (a mesma do presskit e da página):
   café, champanhe, brilho âmbar de nascer do sol, logo LUCCODJ em vetor, selo da Royals. 1200×630. */
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#120C08;font-family:'Space Grotesk',sans-serif;color:#F3E9DC;position:relative}
.foto{position:absolute;right:0;top:0;width:560px;height:630px;background:url(foto.webp) 50% 18%/cover}
.foto::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#120C08 0%,rgba(18,12,8,.6) 26%,rgba(18,12,8,0) 58%),linear-gradient(0deg,rgba(18,12,8,.6),rgba(18,12,8,0) 35%)}
.sol{position:absolute;left:-260px;bottom:-420px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(242,163,58,.32) 0%,rgba(255,106,43,.1) 34%,rgba(18,12,8,0) 66%)}
.txt{position:absolute;left:72px;top:70px;width:640px}
.selo{display:flex;align-items:center;gap:16px}
.selo img{width:150px}
.selo span{font-size:14px;letter-spacing:.42em;text-transform:uppercase;color:#A89B8C}
.logo{width:600px;display:block;margin-top:104px}
.gen{margin-top:26px;font-size:17px;letter-spacing:.42em;text-transform:uppercase;color:#F3E9DC}
.frase{margin-top:22px;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:40px;line-height:1.15;color:#F3E9DC}
.frase i{color:#D9B98A}
.rod{position:absolute;left:72px;bottom:54px;display:flex;align-items:center;gap:18px;font-size:14px;letter-spacing:.34em;text-transform:uppercase;color:#D9B98A}
.rod b{display:block;width:60px;height:1px;background:#D9B98A}
</style></head><body>
<div class="sol"></div>
<div class="foto"></div>
<div class="txt">
  <div class="selo"><img src="royals-gold-transparent.svg"><span>apresenta</span></div>
  <img class="logo" src="lucco.svg">
  <div class="gen">House · Tech House · Afro House</div>
  <div class="frase">Do groove ao <i>pôr do sol</i>.</div>
</div>
<div class="rod"><b></b>Booking · Royals Entretenimento</div>
</body></html>
