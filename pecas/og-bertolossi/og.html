<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sedgwick+Ave+Display&family=Barlow+Condensed:wght@800&display=block" rel="stylesheet">
<style>
/* OG da página /artistas/bertolossi (Royals, 31/10/2026): a capa do presskit v2 ("noite no morro"): foto ao vivo na
   cabine, logo em vetor, pixo e o fato da capa. 1200×630. */
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#0C0C0E;font-family:'Barlow Condensed',sans-serif;color:#F6F2EA;position:relative}
.foto{position:absolute;right:0;top:0;width:640px;height:630px;background:url(foto.jpg) 50% 34%/cover}
.foto::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0C0C0E 0%,rgba(12,12,14,.65) 24%,rgba(12,12,14,0) 55%),linear-gradient(0deg,rgba(12,12,14,.6),rgba(12,12,14,0) 35%)}
.rosa{position:absolute;right:-200px;top:-260px;width:820px;height:820px;border-radius:50%;background:radial-gradient(circle,rgba(255,46,116,.26),rgba(255,46,116,0) 62%)}
.txt{position:absolute;left:64px;top:56px;width:640px}
.selo{display:flex;align-items:center;gap:14px}
.selo img{width:140px}
.selo span{font-family:'Sedgwick Ave Display';font-size:24px;color:#FF8A1E;transform:rotate(-4deg)}
.pixo{display:inline-block;margin-top:58px;font-family:'Sedgwick Ave Display';font-size:40px;color:#FF8A1E;transform:rotate(-4deg);text-shadow:0 0 16px rgba(255,138,30,.45)}
.logo{width:560px;display:block;margin-top:14px}
.frase{margin-top:30px;font-family:'Anton';font-size:64px;line-height:.94;text-transform:uppercase}
.frase i{font-style:normal;color:#FF2E74}
.tag{position:absolute;right:46px;top:52px;font-family:'Sedgwick Ave Display';font-size:58px;color:#F6F2EA;transform:rotate(-8deg);text-shadow:0 0 18px rgba(255,46,116,.6),2px 3px 0 rgba(0,0,0,.55)}
.rod{position:absolute;left:64px;bottom:44px;font-size:18px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:#F4C44A}
</style></head><body>
<div class="rosa"></div>
<div class="foto"></div>
<div class="tag">Martins 021</div>
<div class="txt">
  <div class="selo"><img src="royals-gold-transparent.svg"><span>Amazonas</span></div>
  <span class="pixo">DJ e produtor</span>
  <img class="logo" src="bertolossi.svg">
  <div class="frase">A Vida Rasa 4-4-2<br><i>é dele.</i></div>
</div>
<div class="rod">Contratação no Amazonas · Royals Entretenimento</div>
</body></html>
