<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600;62..125,800&display=block');
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1200px; height:630px; overflow:hidden; background:#050505; color:#F2EEE4; font-family:'Archivo', sans-serif; }
.diag { position:absolute; inset:0; background: repeating-linear-gradient(45deg, transparent 0 46px, rgba(187,158,56,.06) 46px 48px); }
.fio { position:absolute; left:0; right:0; height:2px; background:#BB9E38; }
.esq { position:absolute; left:64px; top:62px; width:460px; }
.rot { font-weight:600; font-size:17px; letter-spacing:.3em; text-transform:uppercase; color:#BB9E38; }
h1 { margin-top: 22px; font-weight:800; font-stretch:125%; font-size: 72px; line-height:.92; text-transform:uppercase; }
h1 span { background: linear-gradient(180deg, #A1861E 0%, #E2B653 55%, #C9A845 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
.sub { margin-top: 22px; font-size: 21px; line-height:1.45; color:#D9D4C8; width: 430px; }
.marcas { position:absolute; left:64px; bottom:52px; display:flex; align-items:center; gap:26px; }
.marcas img { height:40px; } .marcas .bs { height:24px; } .marcas i { width:1px; height:30px; background:rgba(242,238,228,.3); }
.card { position:absolute; top:0; bottom:0; width: 330px; overflow:hidden; }
.card img.f { width:100%; height:100%; object-fit:cover; }
.card .veu { position:absolute; inset:0; background: linear-gradient(180deg, rgba(5,5,5,0) 45%, rgba(5,5,5,.92) 92%); }
.card .logo { position:absolute; left:24px; right:24px; bottom:58px; width: calc(100% - 48px); }
.card .g { position:absolute; left:24px; bottom:30px; font-weight:600; font-size:13px; letter-spacing:.2em; text-transform:uppercase; }
.c1 { left: 540px; border-left:2px solid #BB9E38; } .c1 .g { color:#D9B98A; }
.c2 { left: 870px; border-left:2px solid #BB9E38; } .c2 .g { color:#FF8A1E; }
</style></head><body>
<div class="diag"></div>
<div class="card c1"><img class="f" src="capa-1280.webp" style="object-position:50% 25%"><div class="veu"></div><img class="logo" src="lucco.svg"><div class="g">House · Tech House</div></div>
<div class="card c2"><img class="f" src="vivo-1051-1280.webp" style="object-position:40% 30%"><div class="veu"></div><img class="logo" src="bertolossi.svg"><div class="g">Funk carioca</div></div>
<div class="fio" style="top:0"></div><div class="fio" style="bottom:0"></div>
<div class="esq">
  <div class="rot">Casting · Royals Records</div>
  <h1>Os artistas<br>da <span>Royals</span></h1>
  <p class="sub">Ouça os sets, veja os vídeos e feche data no Amazonas com a Royals.</p>
</div>
<div class="marcas"><img src="royals-gold-transparent.svg"><i></i><img src="royals-records.png"><i></i><img class="bs" src="brandsquad.png"></div>
</body></html>
