<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,600;62..125,800&display=swap" rel="stylesheet">
<style>

*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#070707;font-family:'Archivo',sans-serif;color:#F2ECE0;position:relative}

p{font-size:25px;line-height:1.35;color:#C9C1B3;margin-top:26px;max-width:520px}
.rod{position:absolute;left:70px;bottom:56px;font-size:15px;letter-spacing:.32em;text-transform:uppercase;color:#8D8577}

<div class="foto"></div>
<div class="txt">
