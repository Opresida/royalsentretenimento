<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,600;62..125,800&display=swap" rel="stylesheet">
<style>
/* OG da página /cadastro-artista/bertolossi (Royals, 30/10/2026): identidade da Royals (preto e ouro, Archivo) com o BERTOLOSSI. */
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#070707;font-family:'Archivo',sans-serif;color:#F2ECE0;position:relative}
.halo{position:absolute;right:-120px;top:-60px;width:760px;height:760px;background:radial-gradient(circle,rgba(226,182,83,.20),rgba(7,7,7,0) 62%)}
.foto{position:absolute;right:20px;bottom:-260px;height:900px}
.txt{position:absolute;left:70px;top:64px;width:640px}
.logo{width:230px;display:block}
.fio{width:90px;height:3px;background:linear-gradient(90deg,#E2B653,#A97E2B);margin:44px 0 26px}
.olho{font-size:18px;font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:#E2B653}
.marca{display:block;width:560px;margin-top:30px}
p{font-size:25px;line-height:1.35;color:#C9C1B3;margin-top:26px;max-width:520px}
.rod{position:absolute;left:70px;bottom:56px;font-size:15px;letter-spacing:.32em;text-transform:uppercase;color:#8D8577}
</style></head><body>
<div class="halo"></div><img class="foto" src="bertolossi-recorte.png">
<div class="txt">
  <img class="logo" src="royals.svg">
  <div class="fio"></div>
  <div class="olho">Cadastro de artista</div>
  <img class="marca" src="logo-bertolossi.png" alt="BERTOLOSSI">
  <p>Informações para montar o presskit e a página do DJ BERTOLOSSI.</p>
</div>
<div class="rod">Royals Entretenimento · Royals Records</div>
</body></html>
